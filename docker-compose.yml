x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Job de migração (one-shot). Não sobe com `docker compose up`; o deploy roda
  # `docker compose run --rm migrate` antes de recriar o app1.
  migrate:
    image: sunshinedn/trackflow:latest
    working_dir: /migrate
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]
    logging: *logging
    networks:
      - trackflow-network

  app1:
    image: sunshinedn/trackflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - REDIRECT_BASE_URL=${REDIRECT_BASE_URL}
      - TRACKFLOW_SSO_SECRET=${TRACKFLOW_SSO_SECRET}
      - TRACKFLOW_API_KEY=${TRACKFLOW_API_KEY}
      - AIATENDE_API_KEY=${AIATENDE_API_KEY}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL}
      - PORTAL_INTERNAL_URL=${PORTAL_INTERNAL_URL}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - API_KEY=${API_KEY}
      - NEXT_PUBLIC_META_APP_ID=${NEXT_PUBLIC_META_APP_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_DEVELOPER_TOKEN=${GOOGLE_DEVELOPER_TOKEN}
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT_APP_1:-3010}:3000"
    logging: *logging
    networks:
      - trackflow-network

  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${HOST_PORT_DB:-5434}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    networks:
      - trackflow-network

networks:
  trackflow-network:
    driver: bridge
