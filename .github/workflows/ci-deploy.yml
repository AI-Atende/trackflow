name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar (format + lint + build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build:check
      - run: npm run build

  check-version:
    name: Checar tag de versão
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Falhar se a tag já existir no Docker Hub
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/sunshinedn/trackflow/tags/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "::error::A tag $VERSION já existe no Docker Hub. Suba a versão em package.json antes de mergear."
            exit 1
          fi

  build-and-push:
    name: Build & push da imagem
    needs: check-version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sunshinedn/trackflow:${{ needs.check-version.outputs.version }}
            sunshinedn/trackflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: build-and-push
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-rolling.yml
    with:
      health_url: ${{ vars.PROD_HEALTH_URL }}
    secrets: inherit
